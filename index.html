<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. xhr electronic Product crud (firebase)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h1>Product Crud (firebase, xhr)</h1>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card cardProduct">
                    <div class="card-body">
                        <form id="productForm">
                            <div class="form-group">
                                <label for="brandControl">Brand :</label>
                                <input type="text" class="form-control" id="brandControl">
                            </div>
                            <div class="form-group">
                                <label for="titleControl">Title :</label>
                                <input class="form-control" type="text" id="titleControl">
                            </div>
                            <div class="form-group">
                                <label for="categoryControl">Category :</label>
                                <input class="form-control" type="text" id="categoryControl">
                            </div>
                            <div class="form-group">
                                <label for="priceControl">Price :</label>
                                <input class="form-control" type="text" id="priceControl">
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-info" id="addproductbtn">Add Product</button>
                            <button type="button" class="btn btn-sm btn-block btn-warning d-none" id="updateproductbtn">Update Product</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row">
                    <table class="table table-bordered">
                        <thead class="heads">
                            <tr>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Title</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody id="productContainer">
                            <!-- <tr>
                                <td>dfgvh</td>
                                <td>vbn</td>
                                <td>1234</td>
                                <td>dcfgv</td>
                                <td class="text-center">
                                    <i class="fa-regular fa-pen-to-square fa-2x text-primary"></i>
                                </td>
                                <td class="text-center">
                                    <i class="fa-solid fa-trash fa-2x text-danger"></i>
                                </td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-danger" role="status">
  <span class="sr-only">Loading...</span>
</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
